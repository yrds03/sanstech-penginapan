name: Application checks
on:
  push:
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run check
      - run: node --test tests/backend_check.cjs
      - run: npm run build:css
      - run: git diff --exit-code -- vendor/tailwind.css
      - run: python tests/check_static.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
      - run: python tests/secure_browser_check.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
